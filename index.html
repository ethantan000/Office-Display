<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Display</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Animated background blobs (glassmorphism base layer) -->
  <div class="bg-layer">
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <div class="bg-blob b3"></div>
  </div>

  <!-- Slide progress bar (top of screen, always visible) -->
  <div id="slide-progress-bar" class="slide-progress-bar"></div>

  <!-- Fullscreen overlay for image / video / URL slides -->
  <div id="slide-overlay" class="slide-overlay hidden">
    <img      id="slide-img"    class="slide-asset hidden" alt="" />
    <video    id="slide-video"  class="slide-asset hidden" autoplay muted playsinline></video>
    <iframe   id="slide-iframe" class="slide-asset hidden" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" allowfullscreen></iframe>
    <div id="slide-name-badge" class="slide-name-badge"></div>
  </div>

  <!-- TOP BAR: Logo + Clock/Date -->
  <header class="top-bar dashboard-only">
    <div class="logo-area">
      <img id="company-logo" src="" alt="Company Logo" />
      <span id="company-name">Your Company</span>
    </div>
    <div class="clock-area">
      <div id="clock">00:00:00</div>
      <div id="date">Loading...</div>
    </div>
  </header>

  <!-- MAIN GRID -->
  <main class="grid dashboard-only">

    <section class="card weather-card">
      <h2>Weather</h2>
      <div id="weather-content" class="weather-content">
        <div class="weather-main">
          <span id="weather-icon" class="weather-icon">&#9729;</span>
          <span id="weather-temp" class="weather-temp">--°F</span>
        </div>
        <div id="weather-desc" class="weather-desc">Loading...</div>
        <div id="weather-location" class="weather-location"></div>
        <div class="weather-details">
          <span>&#128167; <span id="weather-humidity">--%</span></span>
          <span>&#127788; <span id="weather-wind">-- mph</span></span>
        </div>
        <div id="weather-forecast" class="weather-forecast"></div>
      </div>
    </section>

    <section class="card calendar-card">
      <h2>Calendar</h2>
      <div id="calendar-container"></div>
    </section>

    <section class="card stocks-card">
      <h2>Market</h2>
      <div id="stocks-container" class="stocks-container"></div>
      <div class="stocks-disclaimer">Prices delayed 15+ min. For display only.</div>
    </section>

    <section class="card message-card">
      <h2>Message of the Day</h2>
      <blockquote id="daily-message" class="daily-message">Loading...</blockquote>
      <cite id="daily-author" class="daily-author"></cite>
    </section>

  </main>

  <!-- BOTTOM TICKER BAR -->
  <footer class="ticker-bar dashboard-only">
    <div class="ticker-label">STOCKS</div>
    <div class="ticker-track-wrapper">
      <div id="bottom-ticker" class="ticker-track">Loading...</div>
    </div>
  </footer>

  <!-- Admin shortcut hint -->
  <div id="admin-hint" class="admin-hint">Press <kbd>A</kbd> to manage playlist</div>

  <script src="config.js"></script>
  <script src="themes.js"></script>
  <script src="app.js"></script>
</body>
</html>
